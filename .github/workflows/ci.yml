# Continuous integration.
#
# `CI Success` is the single required status check on master (see
# infra/github/branch_protection.tf), and the contract with that configuration
# is the job *name*. Real jobs report into it through `needs`, so adding one
# never means touching the Tofu.
#
# What the jobs assert is the Makefile's `check` target, invoked rather than
# restated. A CI leg that spelled out the same command line would be one edit
# away from spelling it out differently, and the laptop and the required check
# would quietly stop testing the same thing.
#
# **No `paths:` filter here, and there must not be one.** A path-filtered
# workflow does not report a skipped check, it reports nothing at all, and a
# required check that never reports leaves the pull request pending forever.
# infra.yml and pr-title-check.yml are filtered or narrow precisely because
# neither is required.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Unpinned, deliberately. The thing being validated is a Claude Code
      # plugin, so the question CI is asking is whether the CLI people
      # actually run will accept it — a pinned CLI answers a question about
      # last month instead. The cost is real and accepted: a new `--strict`
      # warning can turn a green repository red without a commit. That is the
      # signal, not the noise.
      #
      # `validate` reads files and calls nothing, so no credentials are
      # needed; measured with an empty environment and an empty HOME.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # Omp, from its official binary installer. The binary carries its own
      # runtime, so there is no Bun to install — see
      # docs/notes/0011-two-harnesses-one-skill-tree.md for why that route and
      # not `bun install -g`.
      #
      # Unpinned, for the reason the Claude install above is unpinned: the
      # question CI is asking is whether the harness people actually run loads
      # this plugin.
      #
      # This is what keeps `check-omp-plugin` from skipping. That leg's guard
      # exists for a laptop; a CI job without Omp would take the skip and
      # report green having checked nothing.
      # `--retry-all-errors` is what makes `--retry` cover a connection reset:
      # without it curl retries only the errors it considers transient, and a
      # reset on the TLS handshake is not one of them. Measured — this job's
      # first run installed Omp and its second got `curl: (35) Recv failure`
      # from the same URL two minutes later. A real outage still fails the
      # step, and the version call below still fails the job.
      - name: Install Omp
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors https://omp.sh/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `GITHUB_PATH` takes effect on the next step, so the version call is its
      # own step. It is here to fail loudly: without it an installer that put
      # the binary somewhere else would leave `check-omp-plugin` taking its
      # laptop skip, and the job would go green having checked nothing.
      - name: Verify Omp is on PATH
        run: omp --version

      # ShellCheck ships in the ubuntu-latest image; the guard is for the day
      # it does not, and costs nothing on the day it does.
      - name: Ensure ShellCheck
        run: shellcheck --version >/dev/null 2>&1 || sudo apt-get install -y shellcheck

      - run: make check

  # The aggregating job branch protection names. `if: always()` is
  # load-bearing: without it a failure upstream *skips* this job, and GitHub
  # counts a skipped required check as satisfied — the pull request would go
  # green on a failed check.
  ci-success:
    name: CI Success
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "upstream results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::a required job did not succeed: $RESULTS" >&2
              exit 1
            fi
          done
