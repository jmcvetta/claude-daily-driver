# Say on each pull request which release-please tags merging it will cut.
#
# The two things that decide what a merge releases — the Conventional Commit
# type in the title and the files the branch touches — are invisible until the
# merge happens, and on this repository the title is the only input, since
# squash-merge makes it the commit subject. A comment that says "merging this
# releases 0.2.0" is the check that the type in the title is the type the
# author meant.
#
# No `release-type:` input, matching release-please.yml. Its presence is the
# mode switch on both, and they have to agree: set here and not there, the
# projection would describe a differently configured release-please than the
# one the merge gets. Left empty, the action reads
# release-please-config.json and .release-please-manifest.json out of the
# checkout — the same two files release-please.yml reads.
#
# Until the first release is cut there is no tag to resolve the previous
# release against, so the comment carries its unresolved-boundary warning.
# That is correct and expected: a component's first release and a component
# that lost its tag look identical from the outside, and the action reports
# what it can see rather than guessing which one this is.
name: Projected Releases

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: projected-releases-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Not on release-please's own release pull requests. Merging one cuts its
    # tag from the changelog and version already written into the branch,
    # never from the type in the title, so the model this action applies does
    # not describe it.
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history, so the changed-file diff runs from the merge base rather
      # than falling back to the API's capped file list, and so the commit
      # file lists release-please needs are read locally.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jmcvetta/release-please-projected-releases-action@v0
