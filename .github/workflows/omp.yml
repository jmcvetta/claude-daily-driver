# Ask a real Omp whether it still loads this plugin.
#
# `make check` proves the Omp adapter's logic under Node with a faked
# ExtensionAPI (`check-omp-extension`). It never starts Omp, so it cannot see
# discovery: a plugin whose skills Omp does not find, or whose extension Omp
# never reaches, passes it green. `make check-omp-plugin` is that other half,
# and it needs a whole second harness installed to run.
#
# It is its own workflow rather than a leg of ci.yml so that `paths:` below can
# gate it, the way infra.yml is gated. The cost being avoided is a third-party
# binary downloaded on every push, for an integration that only a handful of
# files can break.
#
# **The filter is the set of files that decide whether Omp loads this plugin**,
# measured rather than guessed:
#
#   - `package.json` — Omp's own manifest. `omp.extensions` names the adapter's
#     entry point, and nothing else does; drop `"type": "module"`, move the
#     file, or rename the package, and the extension silently does not load.
#   - `.claude-plugin/**` — the catalog `omp plugin install` reads. Omp takes
#     `.claude-plugin/marketplace.json` as its Claude-compatible fallback
#     (`docs/notes/0011`), so the plugin name, source and version there are
#     what an install resolves against.
#   - `extensions/**` — the adapter itself. A module that throws on import
#     costs one stderr line and the session runs on without it.
#   - `scripts/check-omp-plugin.py` and `Makefile` — the check, and the command
#     line that runs it.
#
# `skills/**` is deliberately NOT in the filter. An added or renamed skill is
# discovered by Omp exactly as by Claude Code, and the layout rules that Omp is
# stricter about — one level under `skills/`, frontmatter name matching the
# directory — are already asserted on every push by `claude plugin validate
# --strict skills` and `check-manifests.py`.
#
# Safe to gate this way only because `omp` is not a required check, for the
# reason infra.yml states at length: a path-filtered workflow reports nothing
# rather than a skip, and a required check that never reports leaves a pull
# request pending for ever. Requiring this one means dropping the filter first.
name: Omp

on:
  push:
    branches: [master]
    # Repeated under pull_request: GitHub Actions does not read YAML anchors.
    # A drift between the two halves is invisible on a pull request and
    # surfaces later as a merge to master that skipped the leg the pull
    # request ran.
    paths:
      - package.json
      - .claude-plugin/**
      - extensions/**
      - scripts/check-omp-plugin.py
      - Makefile
      - .github/workflows/omp.yml
  pull_request:
    paths:
      - package.json
      - .claude-plugin/**
      - extensions/**
      - scripts/check-omp-plugin.py
      - Makefile
      - .github/workflows/omp.yml

permissions:
  contents: read

concurrency:
  group: omp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The official binary installer. The binary carries its own runtime, so
      # there is no Bun to install — see
      # docs/notes/0011-two-harnesses-one-skill-tree.md for why that route.
      #
      # Unpinned, for the reason ci.yml's Claude CLI install is unpinned: the
      # question being asked is whether the harness people actually run loads
      # this plugin, and a pinned one answers it about last month.
      #
      # `--retry-all-errors` is what makes `--retry` cover a connection reset:
      # without it curl retries only the errors it considers transient, and a
      # reset on the TLS handshake is not one of them. Measured — this step
      # installed Omp on one run and answered `curl: (35) Recv failure` from
      # the same URL two minutes later.
      - name: Install Omp
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors https://omp.sh/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `GITHUB_PATH` takes effect on the next step, so this is a step of its
      # own. It fails loudly where an installer put the binary somewhere else,
      # rather than leaving the check below to fail for a reason that reads
      # like a plugin fault.
      - name: Verify Omp is on PATH
        run: omp --version

      - run: make check-omp-plugin
