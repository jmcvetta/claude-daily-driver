task_id: epic-01-slash-epic
description: The literal slash command. Nothing else is being asked for.
tags: [trigger-accuracy, epic, fire]

initial_prompt: "/epic"

agent:
  # See the `pr` suite for why this is `disallowed_tools` rather than
  # `allowed_tools`: a *denied* read of `skills/epic/SKILL.md` still scores as
  # engaging the skill, so the path must be impossible to type.
  disallowed_tools: [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Agent, Task]

run_limits:
  max_turns: 5
  task_timeout: 300
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`epic` fires on the literal /epic"
    expected_skill: epic
    skill_name: epic
    stop_early:
      on_pass: stop
