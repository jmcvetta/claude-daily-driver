task_id: pr-body-04-write-description-for-pr
description: >-
  A numbered pull request that is already open and already correctly titled —
  the whole of the remaining work is the body.
tags: [trigger-accuracy, pr-body, fire]

initial_prompt: >-
  Write the description for pull request #42. It is already open, and its title
  is right.

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`pr-body` fires for a named, already-open pull request"
    expected_skill: pr-body
    skill_name: pr-body
    stop_early:
      on_pass: stop
