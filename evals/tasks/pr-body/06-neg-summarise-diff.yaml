task_id: pr-body-06-neg-summarise-diff
description: >-
  Prose about a diff, in chat, with GitHub explicitly excluded. The work
  `pr-body` does, minus the artifact it does it to.
tags: [trigger-accuracy, pr-body, no-fire]

initial_prompt: >-
  Summarise this diff for me here in chat. No PR, no GitHub — just tell me what
  changed.

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 120

# As with the commit-message case, `expected_skill: none`: the row passes only
# if all three stay silent. `pr-title` is the criterion the ported suite did not
# have.
success_criteria:
  - type: skill_triggered
    description: "`pr-body` does not fire on a chat-only summary"
    expected_skill: none
    skill_name: pr-body
    stop_early: {}
  - type: skill_triggered
    description: "`pr` does not fire on a chat-only summary"
    expected_skill: none
    skill_name: pr
    stop_early: {}
  - type: skill_triggered
    description: "`pr-title` does not fire on a chat-only summary"
    expected_skill: none
    skill_name: pr-title
    stop_early: {}
