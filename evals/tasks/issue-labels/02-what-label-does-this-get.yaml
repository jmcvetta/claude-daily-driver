task_id: issue-labels-02-what-label-does-this-get
description: >-
  A plain question about an issue that does not exist yet. There is no label
  to correct, only one to pick, and picking one before the issue is filed is
  still the skill's job.
tags: [trigger-accuracy, issue-labels, fire]

initial_prompt: >-
  I'm about to file an issue: the CI runner swallows a step's exit code, so a
  failing step still shows green. What label does this get?

agent:
  # `allowed_tools` is a permission allowlist, not a tool filter: the model is
  # still offered `Read` and friends and merely denied at the permission check.
  # That is not enough here. Telemetry records a `tool_use` block when it is
  # generated, before any result, and `skill_triggered` counts a `skills/<name>/`
  # path in ANY tool parameter as engaging that skill — so a *denied* read of
  # `skills/pr/SKILL.md`, which is exactly what a model weighing two sibling
  # skills reaches for, would fail a no-fire row. `disallowed_tools` is the one
  # that actually removes a tool, so the path can never be typed.
  disallowed_tools: [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Agent, Task]

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`issue-labels` fires when asked what label an unfiled issue gets"
    expected_skill: issue-labels
    skill_name: issue-labels
    stop_early:
      on_pass: stop
