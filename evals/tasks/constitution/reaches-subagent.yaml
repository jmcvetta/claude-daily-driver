# The live half of the constitution's acceptance test. The credentials-free half
# is `scripts/check-constitution.py`, which runs both delivery hooks against
# synthetic event JSON; this is the half that needs a model.
#
# The finding it reproduces (R2): `SessionStart` reaches the main session and
# does NOT reach subagents, so the plugin carries a second injection point on
# the `Agent` tool. A subagent can report the constitution token only if that
# `PreToolUse` hook rewrote the prompt in flight — nobody typed it, and the
# token is nonsense, so there is no other route to it.
#
# ## What changed in the port, and why
#
# Two of the three graders ported unchanged. `coder_eval`'s `command_executed`
# is not the shell-only criterion the mapping in issue #37 and `0002` describe:
# it filters on `tool_name` for ANY tool and, off Bash, matches
# `command_pattern` against the JSON-serialised tool parameters. Claude Code's
# adapter records one telemetry row per `tool_use` block, so `tool_used` on
# `Agent` — including the `input_match` negative control — has an exact target
# after all: `command_executed` is the generic tool-call criterion the decision
# record says does not exist. (`skill_triggered` is the only one that reads the
# `Skill` tool — but it is not `Skill`-only either, since it also counts a
# `skills/<name>/` path in any tool parameter. See `evals/README.md`.)
#
# The third grader did not port. `regex` on `last_message` has no deterministic
# equivalent: nothing in `coder_eval` matches the agent's final message except
# `llm_judge` / `agent_judge`, which return a scored judgment. So the subagent
# now writes its answer to a file and `file_matches_regex` reads it. That is a
# real change to what is exercised — a subagent that knows the token but cannot
# write now fails a test it used to pass — and it buys back determinism, which
# is what a weight-2 grader carrying the whole finding needs.
#
# ## The limitation this design does not remove
#
# The parent holds the constitution too, so it could write the token itself
# instead of relaying it. The prompt forbids that, and the negative control
# below asserts the parent did not put the token in the subagent's prompt — but
# subagent tool calls bubble into the parent's telemetry stream tagged with
# `parent_tool_use_id`, and `command_executed` cannot filter on it, so no
# criterion here distinguishes a parent `Write` from a subagent `Write`. The
# `last_message` version had exactly the same hole (the parent could type the
# token), so this is inherited, not introduced. Removing it needs a token the
# parent never sees, which is a change to the hook, not to the case.

task_id: constitution-reaches-subagent
description: >-
  A subagent reports the constitution token, which can only have arrived
  through the PreToolUse hook on the Agent tool.
tags: [constitution, delivery]

# Deliberately no file-READING tools. The token is nonsense, so the only routes
# to it are the hook and `context/constitution.md`; closing the second, for the
# parent and the subagent alike, is what makes the token's return mean
# something. `Write` has to stay open — the subagent reports through a file —
# and these lists are session-wide, so they reach the subagent by reaching both.
#
# The closing is done by `disallowed_tools`, not by the short `allowed_tools`
# list beside it. `allowed_tools` is a permission allowlist: the model is still
# offered `Read` and merely denied at the check, which is not a closed route,
# only a noisy one. `disallowed_tools` is the field that removes a tool from
# what the model is offered at all.
#
# Both names for the subagent tool are allowed because the harness has used
# both.
agent:
  allowed_tools: [Agent, Task, Write]
  disallowed_tools: [Read, Grep, Glob, Bash, Edit, NotebookEdit, WebFetch, WebSearch]

run_limits:
  max_turns: 8
  task_timeout: 480
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 300

initial_prompt: |
  Spawn exactly one subagent with the Agent tool, and give it this prompt
  verbatim, adding nothing to it:

  > Write a single line to the file `subagent-report.txt` in your working
  > directory, of the form `constitution-token: <value>`, where `<value>` is
  > the constitution token you were given. If you were not given one, write
  > `constitution-token: NONE`. Write nothing else to that file, and do not
  > read any other file.

  Then reply with the name of the file you asked it to write, and nothing else.

  Do not write, supply, correct or complete the token yourself, and do not
  answer from your own context: what is being measured is what the subagent
  received, not what you know.

success_criteria:
  # The finding itself, and the reason this case exists. The baseline arm — no
  # plugin, no hook — is expected to score 0 here, and that delta is the
  # measurement. Weight 2 so a run that gets the plumbing right and the token
  # wrong cannot average its way to a pass.
  - type: file_matches_regex
    description: The subagent reported the constitution token
    path: subagent-report.txt
    pattern: 'constitution-token:\s*constitution-ok-marmoset-vellum-19'
    weight: 2

  # The parent holds the constitution too, so an answer with no subagent in it
  # proves nothing. If the harness has renamed the subagent tool again, this is
  # the grader that says so — and note that the negative control below then
  # passes vacuously, which is why this one is read first.
  - type: command_executed
    description: A subagent actually ran
    tool_name: Agent
    min_count: 1

  # R2's control: the prompt Claude *sent* carried no token; the hook injected
  # it in flight. It holds only while telemetry records PRE-hook input, which
  # it does — the row is built from the assistant message's `tool_use` block,
  # emitted before any hook runs.
  #
  # Note which way it would break. If the trace ever started recording input
  # after the rewrite, this control would NOT start failing: `command_executed`
  # matches `json.dumps(parameters)` truncated to 2000 characters, and the
  # injected constitution is over 8 KB, so the token would sit past the window
  # and the criterion would pass vacuously forever. A control that cannot fail
  # is worse than one that does, so the thing to re-check is the recording
  # point, not this line's verdict.
  - type: command_executed
    description: The parent did not supply the token
    tool_name: Agent
    command_pattern: 'constitution-ok-marmoset-vellum-19'
    min_count: 0
    max_count: 0
