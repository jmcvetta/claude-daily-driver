# The Omp half of `09-session-fields-for-claim`, which is tagged `claude-only`
# because the call it reads from is Claude's. `SKILL.md`'s `Claim the issue`
# step says the comment carries the branch, the model, and the session — but
# names no field for any of them, and points at the reference files "for the
# fields that answer both." `skills/undertake/references/omp.md` answers for
# this harness, and the answer is that two of the three are unavailable:
# "There is no session call", so the claim says the surface supplied no model
# and no session, and carries the branch alone. The branch comes from the
# harness's own git state — `git branch --show-current` names it, and
# `OWNER/REPO` for the branch link comes from the `origin` remote.
#
# Why the Claude sibling could not be reused: it grades specific field paths
# on a `get_session` payload —
# `session_context.outcomes[].git_repository.git_info.branches` and
# `external_metadata.last_served_model`. There is no such payload here, so an
# Omp run against that rubric would fail for telling the truth about its own
# surface. This row grades that truth instead, and invents no field to stand
# in for the missing ones.
#
# What this row can and cannot see. The sandbox has no Omp runtime adapter and
# no repository with an `origin` remote, so the claim cannot actually be
# filled in or posted here. What is observable is what the agent says it will
# read, so the graded assertion is an `llm_judge` on the reply, plus the skill
# having fired at all. A positive check against a real claim comment needs a
# live repository and a GitHub client, which is not a sandbox this harness can
# build.
#
# Why this fails the `without` arm: the branch is the easy half — a model with
# no plugin loaded reaches for `git branch --show-current` readily enough. The
# model is the half it gets wrong. Asked what model to record, it names the
# one it believes itself to be, because nothing in general knowledge says the
# surface supplies no model and that the honest claim records the absence.
# That is this skill's own reference file's, and nowhere else's.

task_id: undertake-09-claim-carries-the-branch-alone-omp
description: >-
  Claiming an assigned issue on Omp takes the branch from git and records that
  the surface supplied no model and no session.
tags: [undertake, references, fire, behaviour, omp-only]

initial_prompt: >-
  I'm handing you issue #52 to build. Before you post the claim comment, walk
  me through exactly where you're getting what goes in it — the branch, and
  the model.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`undertake` fires on an issue handed over to be worked on"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: llm_judge
    description: The reply takes the branch from git and records no model and no session
    include_agent_output: true
    include_reference: false
    weight: 2
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: on this Oh My Pi session there is no call that describes the
      session. So the reply must take the branch from the harness's own git
      state — `git branch --show-current`, with `OWNER/REPO` for the link
      coming from the `origin` remote — AND must say that the surface supplies
      no model and no session, so the claim records their absence rather than
      a value.

      Score 1.0 if the REPLY names git as the source of the branch AND says
      the claim carries no model and no session because the surface supplies
      neither.
      Score 0.5 if it gets one of the two right and the other vague — for
      example naming git for the branch but still stating a model as though
      the surface reported it.
      Score 0.0 if the reply names a call or field path that describes the
      session (a `get_session` payload, `last_served_model`, or similar), or
      names no source at all.
