# The Codex half of `09-session-fields-for-claim`, which is tagged `claude-only`
# because the fields it names are Claude's. `undertake`'s `Claim the issue` says
# the comment carries the branch, the model and the session, and points at the
# reference files for where those come from.
# `skills/undertake/references/codex.md`:
#
#   "There is no session call, so two of the three things `Claim the issue`
#   carries are unavailable: the claim says the surface supplied no model and no
#   session, which is the truth of a Codex session, and carries the branch
#   alone."
#
#   "The branch comes from the harness's own git state […] `git branch
#   --show-current` names the branch this session works on. `OWNER/REPO` for the
#   branch link comes from the `origin` remote."
#
# A row that passes without the reference file being read is wrong, so the
# graded content is both halves: git as the branch's source, and the explicit
# record that no model and no session were available.
#
# Why the Claude sibling could not be reused: it grades specific field paths off
# `mcp__Claude_Code_Remote__get_session`, a call a Codex session does not have.
# A Codex run against that rubric would fail for correctly saying there is no
# such call.
#
# Why not the Omp fork either: it grades the same shape — branch from git, no
# model, no session — and would be the closer template, but an arm tag claims
# exactly one arm, so the Codex arm needs its own file or it does not measure
# this at all. The branch's source is named more precisely here: `git branch
# --show-current`, with `OWNER/REPO` from the `origin` remote.
#
# What this row can and cannot see. The sandbox has no GitHub client and no
# session call, so the claim cannot actually be posted. What is observable is
# what the agent says it will do, so the graded assertion is an `agent_judge` on
# the reply, plus the skill having fired at all.
#
# Why this fails the `without` arm: a model with no plugin loaded has no claim
# convention to fill in at all, and no reason to know that a missing model is
# something to record rather than something to omit. Naming the absence is the
# part that cannot be guessed — the constitution's rule against a provenance
# record that guesses is what makes saying "none" the right answer instead of
# saying nothing.

task_id: undertake-09-claim-carries-the-branch-alone-codex
description: >-
  A claim comment on a harness with no session call takes the branch from git
  and records that no model and no session were available.
tags: [undertake, references, fire, behaviour, codex-only, "forks:undertake-09-session-fields-for-claim"]

initial_prompt: >-
  I'm handing you issue #52 to build. Before you post the claim comment, walk
  me through exactly where you're getting what goes in it — the branch, and the
  model.

agent:
  # Recorded and NOT enforced on this harness — `CodexAgent` logs both lists and
  # confines nothing. Written anyway so the row reads the same as its siblings.
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`undertake` fires on an issue handed over to be worked on"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: agent_judge
    description: The reply takes the branch from git and records no model and no session
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`, for the reason
    # docs/notes/0014-the-judge-runs-on-the-subscription.md gives: it grades on
    # the subscription rather than needing an `ANTHROPIC_API_KEY` this project
    # does not have. It stays a Claude judge in this arm — the judge reads a
    # transcript, and which harness produced it changes nothing about reading
    # it. Bounded for the reason the Claude rows state: the default
    # `max_turns: 50` lets a judge with an empty tool surface spend turns on
    # calls it cannot make, and one that overruns cancels the replicate as a
    # TIMEOUT rather than scoring it.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule has two halves, and both must be present.

      The BRANCH comes from the harness's own git state — `git branch
      --show-current`, or plainly "the branch git says is checked out". Naming
      the `origin` remote as the source of `OWNER/REPO` for the link is correct
      and not required.

      The MODEL is not available: this harness has no session call, so the claim
      must SAY that no model and no session could be read, rather than omitting
      them silently or inventing a model name.

      Score 1.0 if the REPLY takes the branch from git AND says the model and
      session are unavailable and will be recorded as such.
      Score 0.5 if it gets one half right.
      Score 0.0 if it names a session call to read the model from, states a
      model name as though it had read one, or omits the model without saying
      why.
