task_id: undertake-07-neg-merge-the-pull-request
description: >-
  Landing a pull request is the non-goal `Keep it current` sits closest to: that
  step merges the base branch *into* the pull request, and a description
  carrying the word `merge` is a description that can start firing on the other
  direction. This row is what holds the two apart.
tags: [trigger-accuracy, undertake, no-fire]

initial_prompt: "Merge PR #25."

agent:
  # See 01: `disallowed_tools`, not `allowed_tools`, is what stops a denied read
  # of `skills/undertake/SKILL.md` scoring as a fire.
  disallowed_tools: [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Agent, Task]

run_limits:
  max_turns: 5
  task_timeout: 300
  turn_timeout: 120

# `expected_skill: none` names no skill in this plugin, so the criterion below
# is a distractor and the row passes only in silence.
success_criteria:
  - type: skill_triggered
    description: "`undertake` does not fire on a request to land a pull request"
    expected_skill: none
    skill_name: undertake
    # A misfire has already lost the row, so there is nothing left to pay for.
    stop_early: {}
