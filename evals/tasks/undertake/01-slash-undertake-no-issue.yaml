task_id: undertake-01-slash-undertake-no-issue
description: >-
  The skill invoked on work that has no issue yet. Before step 0 this was the
  case the skill was told to stay out of; it is now the case step 0 exists for,
  so this row is the boundary having moved.
tags: [trigger-accuracy, undertake, fire]

initial_prompt: "/undertake add a retry loop to the release script"

agent:
  # `allowed_tools` is a permission allowlist, not a tool filter: the model is
  # still offered `Read` and friends and merely denied at the permission check.
  # That is not enough here. Telemetry records a `tool_use` block when it is
  # generated, before any result, and `skill_triggered` counts a `skills/<name>/`
  # path in ANY tool parameter as engaging that skill — so a *denied* read of
  # `skills/undertake/SKILL.md` would score as a fire without the skill ever
  # having been invoked. `disallowed_tools` is the one that actually removes a
  # tool, so the path can never be typed.
  disallowed_tools: [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Agent, Task]

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top.
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`undertake` fires on an invocation that names no issue"
    expected_skill: undertake
    skill_name: undertake
    # Nothing left to observe once it has fired, and this row has no distractor
    # whose absence still needs the rest of the run to establish.
    stop_early:
      on_pass: stop
