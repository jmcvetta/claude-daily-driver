task_id: review-depth-named-depth-outranks-inference
description: >-
  A one-word typo fix, reviewed at the depth the user named rather than the
  depth the diff implies.
tags: [review-depth, routing, fire]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/review-depth
      mount_point: .fixture

pre_run:
  - command: bash .fixture/docs-typo.sh
    timeout: 60

agent:
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Agent, Task]

run_limits:
  max_turns: 30
  task_timeout: 900
  # The agent's real budget for a single-shot task is `turn_timeout`; a larger
  # `task_timeout` cannot extend it. Kept equal so one number means one thing.
  turn_timeout: 900

# The smallest diff in the suite, against the largest depth a user can ask for.
# Inference is the default, not a refusal.
initial_prompt: "Give this branch a full review before I merge it."

success_criteria:
  - type: skill_triggered
    description: "`review` fires on an explicit review request"
    expected_skill: review
    skill_name: review

  # A user who asks for a full review and gets a skim has been overruled by a
  # heuristic. `security-reviewer` is the member only Full adds, so its presence
  # is what separates the named depth from the inferred one.
  - type: command_executed
    description: The security reviewer was dispatched
    tool_name: Agent
    command_pattern: '"subagent_type":\s*"(?:[^"]*:)?security-reviewer"'
    min_count: 1
    weight: 2
