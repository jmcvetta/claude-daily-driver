task_id: review-depth-tests-sit-with-code
description: >-
  A hundred-line test-only diff gets the judgment tier, not the docs skim.
tags: [review-depth, routing, fire]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/review-depth
      mount_point: .fixture

pre_run:
  - command: bash .fixture/tests-only.sh
    timeout: 60

agent:
  # `claude_settings` lives on the claude-code agent config, not the base
  # one, so the kind has to be named here even though the experiment already
  # supplies it — without it the block parses as the base config and the
  # settings are rejected as an extra field.
  type: claude-code
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Agent, Task]

  # `review-depth` grades which agents were dispatched, and on `coder_eval`
  # 0.11.6 no criterion can see that: `command_executed` truncates its haystack
  # to 2000 characters and the `Agent` schema puts `subagent_type` last, after
  # the prompt carrying the diff, while the judge criteria render an `Agent`
  # call as its model-written `description`. So the observation is taken by a
  # `PreToolUse` hook instead — part of the instrument, wired here rather than
  # in the plugin, firing in both arms, reading the tool input verbatim. See
  # `../../fixtures/review-depth/record-dispatch.py`.
  claude_settings:
    hooks:
      PreToolUse:
        - matcher: "^(Agent|Task)$"
          hooks:
            - type: command
              command: python3 .fixture/record-dispatch.py
              timeout: 10

run_limits:
  max_turns: 30
  task_timeout: 1080
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 900

initial_prompt: "Review this branch before I merge it."

success_criteria:
  # The diff is deliberately over the fifty-line skim threshold, so *kind* is
  # what decides: tests bucket with code, not with docs. A test that asserts the
  # bug is what this catches, and the mechanical tier alone will not notice it —
  # so the noticeable failure is a hundred lines of new assertions going through
  # on a skim.
  - type: file_matches_regex
    description: The logic reviewer was dispatched
    path: .fixture/dispatched.txt
    pattern: '^(?:[A-Za-z0-9_.-]+:)?logic-reviewer$'
    # re.MULTILINE, so `^`/`$` bracket one roster line rather than the
    # whole file; the optional prefix tolerates a plugin-namespaced name.
    flags: 8
    weight: 2
