task_id: pr-title-03-what-should-it-be-called
description: >-
  A question rather than an instruction, and no imperative to hang a trigger
  on.
tags: [trigger-accuracy, pr-title, fire]

initial_prompt: >-
  What should this PR be called? It adds a retry with backoff to the HTTP
  client, and nothing else.

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`pr-title` fires when asked what a PR should be called"
    expected_skill: pr-title
    skill_name: pr-title
    stop_early:
      on_pass: stop
