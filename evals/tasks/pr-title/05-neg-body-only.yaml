task_id: pr-title-05-neg-body-only
description: >-
  Body work with the title explicitly ruled out: `pr-body` is the right answer
  and `pr-title` is the wrong one.
tags: [trigger-accuracy, pr-title, no-fire]

initial_prompt: >-
  The PR description is thin — add the engineering detail. The title is fine as
  it stands.

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`pr-body` fires"
    expected_skill: pr-body
    skill_name: pr-body
    # Armed so the watcher counts it as pass-capable and defers the
    # distractor's fail-stop until recall is decided; `on_pass` stays at
    # its default `continue`, so this never truncates a run itself.
    stop_early: {}
  - type: skill_triggered
    description: "`pr-title` does not fire"
    expected_skill: pr-body
    skill_name: pr-title
    stop_early: {}
