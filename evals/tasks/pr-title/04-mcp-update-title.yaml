task_id: pr-title-04-mcp-update-title
description: >-
  The MCP route. `mcp__github__update_pull_request` sets the title and the body
  alike, so naming it settles nothing on its own — the request does.
tags: [trigger-accuracy, pr-title, fire]

initial_prompt: >-
  Set the title on the open pull request — call mcp__github__update_pull_request
  yourself with the corrected title.

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`pr-title` fires when mcp__github__update_pull_request is named for a title"
    expected_skill: pr-title
    skill_name: pr-title
    stop_early:
      on_pass: stop
