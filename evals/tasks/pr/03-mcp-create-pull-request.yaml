task_id: pr-03-mcp-create-pull-request
description: >-
  The user names the MCP call rather than the workflow. The skill has to fire
  on Claude's own route to opening a pull request, not only on the English one.
tags: [trigger-accuracy, pr, fire]

initial_prompt: >-
  Raise the pull request on GitHub for this branch — call
  mcp__github__create_pull_request yourself rather than asking me to.

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`pr` fires when mcp__github__create_pull_request is named"
    expected_skill: pr
    skill_name: pr
    stop_early:
      on_pass: stop
