task_id: pr-02-open-a-pr
description: The natural phrasing, with no slash command and no tool named.
tags: [trigger-accuracy, pr, fire]

initial_prompt: "The feature branch is finished. Open a pull request for it."

agent:
  # `allowed_tools` is a permission allowlist, not a tool filter: the model is
  # still offered `Read` and friends and merely denied at the permission check.
  # That is not enough here. Telemetry records a `tool_use` block when it is
  # generated, before any result, and `skill_triggered` counts a `skills/<name>/`
  # path in ANY tool parameter as engaging that skill — so a *denied* read of
  # `skills/pr/SKILL.md`, which is exactly what a model weighing two sibling
  # skills reaches for, would fail a no-fire row. `disallowed_tools` is the one
  # that actually removes a tool, so the path can never be typed.
  disallowed_tools: [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Agent, Task]

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`pr` fires when a pull request is being opened"
    expected_skill: pr
    skill_name: pr
    # Armed bare rather than `on_pass: stop`, unlike the other fire rows in
    # this suite, and both halves of that matter. The pass-stop had to go: the
    # distractor below establishes an absence, which needs the whole run, and a
    # stop the moment `pr` fires would leave it passing vacuously on every
    # replicate. The bare arm had to stay: it keeps this criterion in the
    # watcher's pass-capable set, so the distractor's fail-stop is deferred
    # while it is undecided. Dropping the key entirely is the false negative
    # "Both arms, every criterion" in `evals/README.md` describes.
    stop_early: {}

  - type: skill_triggered
    description: "`undertake` does not fire on a branch that is already written"
    # This row's ground truth is `pr`, so naming `undertake` here asserts its
    # absence. It is the one collision `undertake` creates: "get it to a pull
    # request" is in its register too, and what separates them is that this
    # prompt has no issue to undertake. The reverse assertion is deliberately
    # absent — `undertake` invokes `pr` at `Open the draft`, so `pr` firing on
    # "take #7" is correct behaviour rather than a collision.
    expected_skill: pr
    skill_name: undertake
    stop_early: {}
