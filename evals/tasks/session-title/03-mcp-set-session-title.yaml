task_id: session-title-03-mcp-set-session-title
description: >-
  The MCP route, which is a trigger in its own right. The prompt still asks in
  ordinary words, so the call is covered rather than isolated — `04` is where
  triggering is tested with no vocabulary to lean on.
tags: [trigger-accuracy, session-title, fire]

# The opening phrasing was `Give this session a name`, which is the literal
# trigger phrase `name this session` from the skill's own description: the row
# would have passed on that alone, with the call name doing no work. It cannot
# be made keyword-free — the call is named `set_session_title` — so the
# description above says what the row measures instead of claiming more.
initial_prompt: >-
  Set this session's title yourself with
  mcp__Claude_Code_Remote__set_session_title.

agent:
  # `allowed_tools` is a permission allowlist, not a tool filter: the model is
  # still offered `Read` and friends and merely denied at the permission check.
  # That is not enough here. Telemetry records a `tool_use` block when it is
  # generated, before any result, and `skill_triggered` counts a `skills/<name>/`
  # path in ANY tool parameter as engaging that skill — so a *denied* read of
  # `skills/pr-title/SKILL.md`, which is exactly what a model weighing two
  # sibling skills about a title reaches for, would fail a no-fire row.
  # `disallowed_tools` is the one that actually removes a tool, so the path can
  # never be typed.
  disallowed_tools: [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Agent, Task]

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top.
  turn_timeout: 120

success_criteria:
  - type: skill_triggered
    description: "`session-title` fires when set_session_title is named"
    expected_skill: session-title
    skill_name: session-title
    stop_early:
      on_pass: stop
