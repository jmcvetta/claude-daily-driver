task_id: session-title-06-neg-commit-message
description: >-
  A commit message. Adjacent enough to be tempting — a short line naming a
  change — and neither title skill owns it.
tags: [trigger-accuracy, session-title, no-fire]

initial_prompt: "Write the commit message for the change I just staged."

agent:
  # `allowed_tools` is a permission allowlist, not a tool filter: the model is
  # still offered `Read` and friends and merely denied at the permission check.
  # That is not enough here. Telemetry records a `tool_use` block when it is
  # generated, before any result, and `skill_triggered` counts a `skills/<name>/`
  # path in ANY tool parameter as engaging that skill — so a *denied* read of
  # `skills/pr-title/SKILL.md`, which is exactly what a model weighing two
  # sibling skills about a title reaches for, would fail a no-fire row.
  # `disallowed_tools` is the one that actually removes a tool, so the path can
  # never be typed.
  disallowed_tools: [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Agent, Task]

run_limits:
  max_turns: 5
  task_timeout: 300
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top.
  turn_timeout: 120

# `expected_skill: none` names no skill in this plugin, so every criterion below
# is a distractor and the row passes only in silence. Each row has nothing
# pass-capable beside it, so `stop_early: {}` is armed for the other reason: a
# misfire has already lost the row, and there is no recall decision left to
# pre-empt.
success_criteria:
  - type: skill_triggered
    description: "`session-title` does not fire on a commit message"
    expected_skill: none
    skill_name: session-title
    stop_early: {}
  - type: skill_triggered
    description: "`pr-title` does not fire on a commit message"
    expected_skill: none
    skill_name: pr-title
    stop_early: {}
  - type: skill_triggered
    description: "`conventional-commits-type` does not fire on a commit message"
    expected_skill: none
    skill_name: conventional-commits-type
    stop_early: {}
